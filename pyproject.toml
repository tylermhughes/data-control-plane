[project]
name = "data-control-plane"
version = "0.9.0"
description = "Self-hosted control plane for AI training data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.118",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "openapi-python-client==0.29.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "schemathesis==4.30.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated from openapi.yaml; it follows the generator's own style (see its pyproject.toml).
extend-exclude = ["clients/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]  # asserts; dummy credentials for stubbed clients
# Generated by Alembic autogenerate; long lines are normal there.
"migrations/versions/**" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
# These libraries don't ship type information; adding stub packages would be more dependencies.
module = ["boto3", "boto3.*", "botocore", "botocore.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
