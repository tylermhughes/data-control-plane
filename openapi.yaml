        eval_metric:
          type: string
          title: Eval Metric
          examples:
          - recall@0.5
        point_size:
          type: number
          title: Point Size
          examples:
          - 0.01
        value_per_point:
          type: string
          title: Value Per Point
          examples:
          - '25000.00'
        currency:
          type: string
          title: Currency
          examples:
          - USD
        value:
