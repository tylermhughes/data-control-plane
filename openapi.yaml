components:
  schemas:
    AcceptanceRule:
      properties:
        metric:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          title: Metric
          description: Lowercase letters, digits and underscores, starting with a
            letter.
          examples:
          - agreement
        operator:
          type: string
          enum:
          - '>='
          - '>'
          - <=
          - <
          - ==
          title: Operator
          examples:
          - '>='
        threshold:
          type: number
          title: Threshold
          examples:
          - 0.85
        applies_to:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Applies To
          description: Limit the rule to items with these attribute values.
          examples:
          - damage_size: small_dent
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - metric
      - operator
      - threshold
      title: AcceptanceRule
      description: A pass/fail rule for batches, e.g. agreement >= 0.85. Checked automatically
        from M6.
    AllocatedTotal:
      properties:
        unit:
          type: string
          title: Unit
          examples:
          - images
        currency:
          type: string
          title: Currency
          examples:
          - USD
        quantity:
          type: integer
          title: Quantity
          examples:
          - 12000
        quoted_cost:
          type: string
          title: Quoted Cost
          examples:
          - '25000.00'
      type: object
      required:
      - unit
      - currency
      - quantity
      - quoted_cost
      title: AllocatedTotal
      description: Allocated so far (planned, active and complete allocations) for
        one unit and currency.
    Allocation:
      properties:
        id:
          type: string
          title: Id
          examples:
          - alc_01m5n7gwqfa18zhpw1zwh7w2zy
        project_id:
          type: string
          title: Project Id
        request_id:
          type: string
          title: Request Id
        data_source_id:
          type: string
          title: Data Source Id
        spec_version_id:
          type: string
          title: Spec Version Id
          description: The spec version this allocation was quoted against. Never
            changes.
        quantity:
          type: integer
          title: Quantity
          examples:
          - 4000
        unit:
          type: string
          title: Unit
          examples:
          - images
        quoted_unit_rate:
          type: string
          title: Quoted Unit Rate
          examples:
          - '1.55'
        currency:
          type: string
          title: Currency
          examples:
          - USD
        quoted_cost:
          type: string
          title: Quoted Cost
          description: quantity × quoted_unit_rate.
          examples:
          - '6200.00'
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
        notes:
          type: string
          title: Notes
        status:
          type: string
          enum:
          - planned
          - active
          - complete
          - cancelled
          title: Status
        activated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Activated At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cancelled At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - project_id
      - request_id
      - data_source_id
      - spec_version_id
      - quantity
      - unit
      - quoted_unit_rate
      - currency
      - quoted_cost
      - due_date
      - notes
      - status
      - activated_at
      - completed_at
      - cancelled_at
      - created_at
      - updated_at
      title: Allocation
    AllocationCreate:
      properties:
        request_id:
          type: string
          title: Request Id
        data_source_id:
          type: string
          title: Data Source Id
          description: Must be in the same project as the request.
        quantity:
          type: integer
          maximum: 1000000000.0
          exclusiveMinimum: 0.0
          title: Quantity
          examples:
          - 10000
        unit:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
            pattern: ^[a-z][a-z0-9_ ]*$
          - type: 'null'
          title: Unit
          description: Defaults to the data source's `default_unit`.
        quoted_unit_rate:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Quoted Unit Rate
          description: Quoted price per unit.
          examples:
          - '25000.00'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
          description: ISO 4217 code.
          examples:
          - USD
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
        notes:
          type: string
          maxLength: 10000
          title: Notes
          default: ''
      additionalProperties: false
      type: object
      required:
      - request_id
      - data_source_id
      - quantity
      - quoted_unit_rate
      - currency
      title: AllocationCreate
      examples:
      - currency: USD
        data_source_id: src_01m5n7gwqfa18zhpw1zwh7w2zy
        due_date: '2026-12-01'
        notes: Quote Q-2210, includes 5% gold images.
        quantity: 4000
        quoted_unit_rate: '1.55'
        request_id: req_01m5n7gwqfa18zhpw1zwh7w2zy
    AllocationUpdate:
      properties:
        quantity:
          anyOf:
          - type: integer
            maximum: 1000000000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Quantity
        unit:
          anyOf:
          - type: string
            maxLength: 32
            minLength: 1
            pattern: ^[a-z][a-z0-9_ ]*$
          - type: 'null'
          title: Unit
        quoted_unit_rate:
          anyOf:
          - anyOf:
            - type: number
              minimum: 0.0
            - type: string
            examples:
            - '25000.00'
          - type: 'null'
          title: Quoted Unit Rate
        currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 code.
            examples:
            - USD
          - type: 'null'
          title: Currency
        due_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Due Date
        notes:
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      title: AllocationUpdate
      description: 'Planned allocations: any field. Active: only quantity, due date
        and notes.

        Complete or cancelled: nothing.'
      examples:
      - due_date: '2026-12-08'
        quantity: 5000
    ApiKey:
      properties:
        id:
          type: string
          title: Id
          examples:
          - key_01jbx4k9r2abcdefghjkmnpqrs
        name:
          type: string
          title: Name
          examples:
          - CI pipeline
        key_prefix:
          type: string
          title: Key Prefix
