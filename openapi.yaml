openapi: 3.1.0
info:
  title: Data Control Plane API
  description: 'The control plane for AI training data: plan, route, check and measure
    data from every source. Everything the product does is available through this
    API.


    **Authentication:** send your API key as `Authorization: Bearer dcp_...` (in these
    docs, use the **Authorize** button). **Errors** use the RFC 9457 problem format.
    **Retries:** POST requests accept an `Idempotency-Key` header.'
  version: 0.9.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Is the server running?
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
      - health
      summary: Can the server reach the database?
      operationId: readyz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /v1/me:
    get:
      tags:
      - api keys
      summary: Which API key am I using?
      description: Works with any valid key. Handy for checking that a key works and
        what it can do.
      operationId: me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - ApiKey: []
  /v1/projects:
    get:
      tags:
      - projects
      summary: List projects
      description: Admin keys see every project. Project keys see only their own.
      operationId: list_projects
      security:
      - ApiKey: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Maximum items per page.
          default: 50
          title: Limit
        description: Maximum items per page.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page.'
          title: Cursor
        description: '`next_cursor` from the previous page.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Project_'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
    post:
      tags:
      - projects
      summary: Create a project
      description: Needs an admin key with write access. Names must be unique.
      operationId: create_project
      security:
      - ApiKey: []
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9._:-]{1,255}$
          - type: 'null'
          description: 'Any unique value, e.g. a UUID or `ci-run-42` (letters, digits
            and `. _ : -`, up to 255 characters). Retrying with the same key returns
            the original response instead of creating a duplicate. Leave empty if
            you don''t need it.'
          examples:
          - 3f2b8c1e-6d7a-4b9e-9f00-2a1c5e7d8b94
          title: Idempotency-Key
        description: 'Any unique value, e.g. a UUID or `ci-run-42` (letters, digits
          and `. _ : -`, up to 255 characters). Retrying with the same key returns
          the original response instead of creating a duplicate. Leave empty if you
          don''t need it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
