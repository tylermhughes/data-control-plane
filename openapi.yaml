        attribute_counts:
          package_type:
            corrugated_box: 4100
            shrink_wrapped: 3300
        decided_by: Dana Okafor
    BatchCreate:
      properties:
        allocation_id:
          type: string
          title: Allocation Id
          description: Must be active.
        received_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Received At
          description: Defaults to now.
        delivered_count:
          anyOf:
          - type: integer
            maximum: 1000000000.0
            minimum: 0.0
          - type: 'null'
          title: Delivered Count
          description: Items delivered. If left out (only allowed when files are listed),
            DCP fills it in from the files' record count after the checks.
        spend:
          anyOf:
          - anyOf:
            - type: number
              minimum: 0.0
            - type: string
            examples:
            - '25000.00'
          - type: 'null'
          title: Spend
          description: 'What this delivery cost. If left out, DCP estimates it as
            the allocation''s quoted rate × delivered_count (`spend_is_estimate: true`)
            until it''s set.'
        currency:
          anyOf:
          - type: string
            pattern: ^[A-Z]{3}$
            description: ISO 4217 code.
            examples:
            - USD
          - type: 'null'
          title: Currency
          description: Defaults to the allocation's currency.
        contributor_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Contributor Count
          description: People who worked on it.
        artifacts:
          items:
            $ref: '#/components/schemas/Artifact'
          type: array
          maxItems: 1000
          title: Artifacts
          description: Delivered files. If any are listed, DCP checks them automatically.
        reported_metrics:
          additionalProperties:
            type: number
          type: object
          title: Reported Metrics
          description: 'Values DCP can''t measure from the files, reported by the
