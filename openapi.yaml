        Complete or cancelled: nothing.'
      examples:
      - due_date: '2026-12-08'
        quantity: 5000
    Amount:
      properties:
        currency:
          type: string
          title: Currency
          examples:
          - USD
        amount:
          type: string
          title: Amount
          examples:
          - '25000.00'
      type: object
      required:
      - currency
      - amount
      title: Amount
    ApiKey:
