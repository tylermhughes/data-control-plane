      - allocation_id
      - data_source_id
      - spec_version_id
      - received_at
      - status
      - delivered_count
      - accepted_count
      - rejected_count
      - contributor_count
      - spend
      - currency
      - attribute_counts
      - artifacts
      - reported_metrics
      - delivered_count_from_files
      - spend_is_estimate
      - quality
      - override_reason
      - notes
      - decision_source
      - decided_by
      - decided_by_key_id
      - decided_at
      - rejection_reason
      - external_ref
      - external_url
      - created_at
      - updated_at
      title: Batch
    BatchAccept:
      properties:
        accepted_count:
          type: integer
          minimum: 0.0
          title: Accepted Count
          description: Items kept. Can be less than delivered.
        attribute_counts:
          anyOf:
          - additionalProperties:
              additionalProperties:
                type: integer
              type: object
            type: object
          - type: 'null'
          title: Attribute Counts
          description: 'Accepted items per attribute value, e.g. {"package_type":
            {"shrink_wrapped": 3300}}. Optional.'
        decided_by:
          type: string
          maxLength: 200
          title: Decided By
          description: Who decided.
          default: ''
        override_reason:
          anyOf:
          - type: string
            maxLength: 10000
            minLength: 1
          - type: 'null'
          title: Override Reason
          description: 'Required to accept a batch whose checks failed: why it''s
            accepted anyway.'
      additionalProperties: false
      type: object
      required:
      - accepted_count
      title: BatchAccept
      examples:
