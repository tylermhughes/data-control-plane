        rejected_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rejected Count
          description: delivered − accepted.
          examples:
          - 710
        contributor_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Contributor Count
          examples:
          - 46
        spend:
          type: string
          title: Spend
          examples:
          - '18600.00'
        currency:
          type: string
          title: Currency
          examples:
          - USD
        attribute_counts:
          additionalProperties:
            additionalProperties:
              type: integer
            type: object
          type: object
          title: Attribute Counts
          description: As reported (see `quality` for counts from the files).
        artifacts:
          items:
            $ref: '#/components/schemas/Artifact'
          type: array
          title: Artifacts
        reported_metrics:
          additionalProperties:
            type: number
          type: object
          title: Reported Metrics
        delivered_count_from_files:
          type: boolean
          title: Delivered Count From Files
          description: True while DCP fills delivered_count in from the files' record
