          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
    delete:
      tags:
      - projects
      summary: Delete a project
      description: Needs an admin key with write access. Revoke the project's API
        keys first.
      operationId: delete_project
      security:
      - ApiKey: []
      parameters:
      - name: project_id
        in: path
