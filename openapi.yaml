          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
    delete:
      tags:
