          - prj_01m5n7gwqfa18zhpw1zwh7w2zy
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
          description: Unique within the project.
        description:
          type: string
          maxLength: 10000
          title: Description
          default: ''
        eval_metric:
          type: string
          maxLength: 200
          minLength: 1
          title: Eval Metric
          description: The main eval metric for this capability.
        higher_is_better:
          type: boolean
          title: Higher Is Better
          description: False for metrics like error rate.
          default: true
        value_per_point:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Value Per Point
          description: Estimated business value of one point of improvement on the
            eval metric.
          examples:
          - '25000.00'
        point_size:
          type: number
          exclusiveMinimum: 0.0
          title: Point Size
          description: 'How much of the metric is one point. Use 0.01 for a 0–1 metric
            such as recall, so 0.812 → 0.857 is 4.5 points. Default 1: one unit as
            recorded.'
          default: 1.0
        flattening_threshold:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Flattening Threshold
          description: The diagnosis calls returns 'flattening' when the latest dataset
            version's points per 10K fall below this share of the earlier versions'
            average.
          default: 0.5
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
          description: ISO 4217 code.
          examples:
          - USD
