        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: 'Approximate: updated at most once a minute.'
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
