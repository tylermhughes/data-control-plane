        size_bytes:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Size Bytes
        record_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Record Count
      additionalProperties: false
      type: object
      required:
      - uri
      - format
      title: Artifact
      description: A pointer to delivered data. DCP stores the pointer, not the data.
    Attribute:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          title: Name
          description: Lowercase letters, digits and underscores, starting with a
