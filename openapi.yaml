        schema:
          type: string
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
