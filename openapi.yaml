          - type: string
            format: date-time
          - type: 'null'
          title: Decided At
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        external_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: External Ref
