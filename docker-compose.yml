# Start everything: docker compose up --build
# Settings come from .env (copy .env.example to .env first).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dcp}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dcp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dcp}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${DCP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Throwaway database for ./scripts/check.sh. Only starts with --profile test,
  # keeps data in memory, and is reachable only from this machine.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcp
      POSTGRES_PASSWORD: dcp-test
      POSTGRES_DB: dcp_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcp -d dcp_test"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  db-data:
