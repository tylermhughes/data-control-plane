# Start everything: docker compose up --build
# Settings come from .env (copy .env.example to .env first).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dcp}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dcp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dcp}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DCP_SECRET_KEY: ${DCP_SECRET_KEY:?Set DCP_SECRET_KEY in .env (see .env.example)}
    ports:
      - "${DCP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      DCP_LOCAL_DATA_DIR: /data
      DCP_S3_ENDPOINT_URL: ${DCP_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    # Local files for quality checks: ./data on this machine is file:///data/... to DCP.
    volumes:
      - ./data:/data:ro
    # Lets webhooks reach a receiver on the host machine (built in on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Local S3-compatible storage for trying the bucket watcher (dev profile only):
  #   docker compose --profile dev up --build
  # Every folder in ./data/s3 is a bucket; drop files in to "deliver" them.
  # From DCP use endpoint http://s3:7070; from this machine http://localhost:7070.
  s3:
    profiles: ["dev"]
    image: versity/versitygw:v1.8.0
    command:
      - --access
      - ${DCP_DEV_S3_ACCESS_KEY:-dcp-dev-access}
      - --secret
      - ${DCP_DEV_S3_SECRET_KEY:-dcp-dev-secret-change-me}
      - posix
      - --sidecar
      - /meta
      - /buckets
    volumes:
      - ./data/s3:/buckets
      - s3-meta:/meta
    ports:
      - "127.0.0.1:7070:7070"

  # Throwaway S3-compatible storage for ./scripts/check.sh (test profile, in memory).
  s3-test:
    profiles: ["test"]
    image: versity/versitygw:v1.8.0
    command: ["--access", "test-access", "--secret", "test-secret-key", "posix", "--sidecar", "/meta", "/buckets"]
    tmpfs:
      - /buckets
      - /meta
    ports:
      - "127.0.0.1:57070:7070"

  # Throwaway database for ./scripts/check.sh. Only starts with --profile test,
  # keeps data in memory, and is reachable only from this machine.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcp
      POSTGRES_PASSWORD: dcp-test
      POSTGRES_DB: dcp_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcp -d dcp_test"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  s3-meta:
