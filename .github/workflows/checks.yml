# Runs every check (./scripts/check.sh) on pull requests and on pushes to main.
# It starts running once this repository is on GitHub.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the breaking-change check compares openapi.yaml with main
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Run all checks
        env:
          DCP_API_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: ./scripts/check.sh
