[project]
name = "dcp-cli"
version = "0.9.0"
description = "Command-line tool for Data Control Plane, built on the generated dcp-client"
requires-python = ">=3.11"
dependencies = ["dcp-client"]

[project.scripts]
dcp = "dcp_cli:main"

[tool.uv.sources]
dcp-client = { path = "../python", editable = true }

[tool.uv.build-backend]
module-name = "dcp_cli"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
